<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Logo Preview</title>
<style>
  body { margin:0; background:#111; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; gap:30px; font-family:Arial,sans-serif; color:#fff; }
  .bg-dark { background:#111; padding:20px; border-radius:12px; }
  .bg-light { background:#eee; padding:20px; border-radius:12px; }
  .bg-grad  { background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460); padding:20px; border-radius:12px; }
  p { font-size:12px; color:#666; margin:4px 0 0; text-align:center; }
  h3 { color:#888; margin-bottom:6px; font-size:13px; text-transform:uppercase; letter-spacing:1px; }
</style>
</head>
<body>
  <h2 style="color:#fff;letter-spacing:3px">PREVISUALIZACIÓN SVG</h2>

  <div>
    <h3>Fondo oscuro</h3>
    <div class="bg-dark">
      <svg width="250" height="250" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
        <path d="M225 30 L315 30 L262 128 L340 128 L185 265 L238 148 L158 148 Z" fill="white" stroke="white" stroke-width="4" stroke-linejoin="round"/>
        <text x="250" y="340" font-family="Arial, sans-serif" font-weight="bold" font-size="68" fill="white" text-anchor="middle" letter-spacing="2">LALIGA</text>
        <text x="250" y="395" font-family="Arial, sans-serif" font-weight="bold" font-size="30" fill="white" text-anchor="middle" letter-spacing="1">HYPERTENSIONES</text>
      </svg>
    </div>
    <p>Fondo #111</p>
  </div>

  <div>
    <h3>Fondo gradiente azul</h3>
    <div class="bg-grad">
      <svg width="250" height="250" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
        <path d="M225 30 L315 30 L262 128 L340 128 L185 265 L238 148 L158 148 Z" fill="white" stroke="white" stroke-width="4" stroke-linejoin="round"/>
        <text x="250" y="340" font-family="Arial, sans-serif" font-weight="bold" font-size="68" fill="white" text-anchor="middle" letter-spacing="2">LALIGA</text>
        <text x="250" y="395" font-family="Arial, sans-serif" font-weight="bold" font-size="30" fill="white" text-anchor="middle" letter-spacing="1">HYPERTENSIONES</text>
      </svg>
    </div>
    <p>Fondo degradado</p>
  </div>

  <div>
    <h3>Fondo claro</h3>
    <div class="bg-light">
      <svg width="250" height="250" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
        <path d="M225 30 L315 30 L262 128 L340 128 L185 265 L238 148 L158 148 Z" fill="#222" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
        <text x="250" y="340" font-family="Arial, sans-serif" font-weight="bold" font-size="68" fill="#222" text-anchor="middle" letter-spacing="2">LALIGA</text>
        <text x="250" y="395" font-family="Arial, sans-serif" font-weight="bold" font-size="30" fill="#222" text-anchor="middle" letter-spacing="1">HYPERTENSIONES</text>
      </svg>
    </div>
    <p>Fondo claro</p>
  </div>

  <div>
    <h3>Versión neón verde flúor ⚡</h3>
    <div class="bg-dark">
      <svg width="250" height="250" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="glow">
            <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
            <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <path d="M225 30 L315 30 L262 128 L340 128 L185 265 L238 148 L158 148 Z" fill="#39ff14" stroke="#39ff14" stroke-width="4" stroke-linejoin="round" filter="url(#glow)"/>
        <text x="250" y="340" font-family="Arial, sans-serif" font-weight="bold" font-size="68" fill="white" text-anchor="middle" letter-spacing="2">LALIGA</text>
        <text x="250" y="395" font-family="Arial, sans-serif" font-weight="bold" font-size="30" fill="#39ff14" text-anchor="middle" letter-spacing="1">HYPERTENSIONES</text>
      </svg>
    </div>
    <p>Rayo neón verde flúor (#39ff14)</p>
  </div>

</body>
</html>
