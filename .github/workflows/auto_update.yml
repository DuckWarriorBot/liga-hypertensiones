name: Liga Hypertensiones – Auto Update

# ── Cuándo se ejecuta ─────────────────────────────────────────────────────────
on:
  schedule:
    # Cada 5 min en horario de partidos: 12:00-21:55 UTC (14:00-23:55 España)
    - cron: '*/5 12-21 * * *'
    # Una vez al día a las 06:00 UTC para refresco completo (madrugada España)
    - cron: '0 6 * * *'
  workflow_dispatch:   # Permite lanzarlo manualmente desde la UI de GitHub

# ── Evitar runs concurrentes que causarían conflictos en git push ─────────────
# cancel-in-progress: false → los runs se encolan en lugar de cancelarse;
# con runs de ~2.5 min cada 5 min no hay problema de cola.
concurrency:
  group: auto-update
  cancel-in-progress: false

# ── Permisos para que pueda hacer git push ────────────────────────────────────
permissions:
  contents: write

# ── Trabajo principal ─────────────────────────────────────────────────────────
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # 1. Checkout del repo (con token para poder hacer push después)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      # 2. Python 3.11
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Cache pip (ahorra ~30s por run)
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      # 4. Cache Playwright Chromium (ahorra ~60s por run: de ~5min a ~2.5min)
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      # 5. Instalar dependencias Python (incluye playwright-stealth para anti-bot)
      - name: Install Python deps
        run: pip install -r requirements.txt

      # 6. Instalar Chromium para Playwright (usa caché si está disponible)
      - name: Install Playwright + Chromium
        run: python -m playwright install chromium --with-deps

      # 6. Actualizar datos desde Marca.com + football-data.co.uk
      - name: fetch_all.py
        run: python fetch_all.py

      # 7. Actualizar marcadores y fixtures desde Flashscore
      #    continue-on-error: si Flashscore bloquea (anti-bot), el build continúa
      #    con los datos del commit anterior en lugar de abortar todo el job.
      #    fetch_flashscore.py ya tiene reintentos internos (3 intentos, backoff).
      - name: fetch_flashscore.py
        run: python fetch_flashscore.py
        continue-on-error: true

      # 8. Actualizar scores adicionales (football-data.co.uk CSV)
      - name: fetch_scores.py
        run: python fetch_scores.py

      # 9. Generar index.html
      - name: build.py
        run: python build.py

      # 10. Deploy SFTP a IONOS
      - name: Deploy to IONOS
        env:
          IONOS_SFTP_PASS: ${{ secrets.IONOS_SFTP_PASS }}
        run: python deploy.py --sftp --only-deploy

      # 11. Commit y push de los datos actualizados al repo
      #     (para que el siguiente run arranque con datos frescos)
      #     Nota: results_db.json y version.json están en .gitignore (no trackeados)
      #     → NO incluirlos en git add o git add falla con exit code 1
      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add liga_data.json scores_data.json besoccer_ids.json \
                  predictions.json predictions_history.json \
                  as_stats.json
          # Solo hace commit si hay cambios
          if ! git diff --staged --quiet; then
            JORNADA=$(python -c "import json; print(json.load(open('liga_data.json'))['total_rounds'])")
            git commit -m "auto: J${JORNADA} – $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push origin HEAD:master
          else
            echo "Sin cambios, no se hace commit."
          fi

# ── Job secundario: stats AS.com (solo una vez al día) ───────────────────────
  as_stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: update   # Espera a que update termine para evitar conflictos de git push
    # Solo corre en el trigger diario de las 06:00 UTC (no en los cada-15-min)
    if: (github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch') && always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Playwright + Chromium
        run: python -m playwright install chromium --with-deps

      - name: fetch_as.py (temporada actual)
        run: python fetch_as.py 2025_2026

      - name: Commit as_stats.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add as_stats.json
          if ! git diff --staged --quiet; then
            git commit -m "auto: AS stats – $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "Sin cambios en as_stats.json"
          fi
