name: Actualizar Liga Hypertensiones

on:
  schedule:
    # Cada 10 minutos entre 13:00 y 23:59 UTC+2 (11:00-21:59 UTC)
    # → cubre todas las ventanas de partido de Segunda División
    - cron: '*/10 11-21 * * *'
    # Cada hora fuera de esa ventana (madrugada/mañana)
    - cron: '0 0-10,22-23 * * *'
  workflow_dispatch:   # botón "Run workflow" manual en GitHub

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout del repositorio ──────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Python ────────────────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      # ── 3. Playwright Chromium ───────────────────────────────────────────
      - name: Instalar Chromium (Playwright)
        run: python -m playwright install chromium --with-deps

      # ── 4. Restaurar predictions_history.json del caché ──────────────────
      #    Así conservamos el historial entre runs sin commitearlo
      - name: Restaurar caché de predictions_history
        uses: actions/cache@v4
        with:
          path: predictions_history.json
          key: predictions-history-${{ github.run_id }}
          restore-keys: |
            predictions-history-

      # ── 5. Pipeline de actualización ─────────────────────────────────────
      - name: fetch_all.py  (Marca.com)
        run: python fetch_all.py

      - name: fetch_flashscore.py  (Flashscore live)
        run: python fetch_flashscore.py

      - name: fetch_predictions_history.py
        run: python fetch_predictions_history.py

      - name: build.py  (genera index.html + version.json)
        run: python build.py

      # ── 6. Deploy SFTP a IONOS ───────────────────────────────────────────
      - name: Deploy a IONOS via SFTP
        env:
          SFTP_SERVER:   ${{ secrets.SFTP_SERVER }}
          SFTP_PORT:     ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PATH:     ${{ secrets.SFTP_PATH }}
        run: |
          sudo apt-get install -y lftp
          lftp -c "
            set sftp:auto-confirm yes;
            set net:timeout 30;
            set net:max-retries 3;
            open sftp://${SFTP_USERNAME}:${SFTP_PASSWORD}@${SFTP_SERVER}:${SFTP_PORT:-22};
            cd "${SFTP_PATH:-.}";
            put index.html;
            put version.json;
            put liga_data.json;
            put scores_data.json;
            put predictions.json;
            put predictions_history.json;
            bye
          "
