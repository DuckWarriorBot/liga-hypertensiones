name: Actualizar Liga Hypertensiones [DESACTIVADO – usar auto_update.yml]

# ──────────────────────────────────────────────────────────────────────────────
# DESACTIVADO: este workflow es un duplicado de auto_update.yml.
# Tenerlos ambos activos provoca ejecuciones en paralelo que se sobreescriben.
# Toda la lógica consolidada está en auto_update.yml.
# ──────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:  # Solo lanzado manualmente; schedule desactivado (ver auto_update.yml)

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout del código ────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Python 3.11 ───────────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar Chromium (para Playwright)
        run: python -m playwright install chromium --with-deps

      # ── 3. Descargar datos persistentes del hosting ───────────────────────
      # results_db.json: resultados bloqueados manualmente (no regenerable)
      # predictions_history.json: historial acumulado de predicciones
      - name: Descargar datos persistentes desde hosting
        env:
          IONOS_SFTP_PASS: ${{ secrets.IONOS_SFTP_PASS }}
        run: |
          python - <<'EOF'
          import paramiko, os

          HOST = 'home559128403.1and1-data.host'
          PORT = 22
          USER = 'acc147683744'
          PASS = os.environ.get('IONOS_SFTP_PASS', '')

          if not PASS:
              print('IONOS_SFTP_PASS no configurado — se usarán archivos del repo')
              raise SystemExit(0)

          try:
              t = paramiko.Transport((HOST, PORT))
              t.connect(username=USER, password=PASS)
              s = paramiko.SFTPClient.from_transport(t)

              for fname in ['results_db.json', 'predictions_history.json', 'predictions.json']:
                  try:
                      s.get(fname, fname)
                      print(f'OK  {fname} descargado del hosting')
                  except FileNotFoundError:
                      print(f'--  {fname} no existe en hosting (se generará)')

              s.close()
              t.close()
          except Exception as e:
              print(f'WARN: No se pudo conectar al hosting: {e}')
              print('      Continuando con archivos del repo como fallback')
          EOF

      # ── 4. Fetch de datos ─────────────────────────────────────────────────
      - name: fetch_all (Marca — calendario y resultados V/E/D)
        run: python fetch_all.py

      - name: fetch_as (AS.com — clasificación oficial y racha)
        run: python fetch_as.py || echo "WARN fetch_as falló (no crítico)"

      - name: fetch_scores (football-data.co.uk — marcadores históricos)
        run: python fetch_scores.py || echo "WARN fetch_scores falló (no crítico)"

      - name: fetch_flashscore (Flashscore — en vivo y marcadores actuales)
        run: python fetch_flashscore.py

      - name: fetch_playoff (Playoff — si existe)
        run: python fetch_playoff.py || echo "WARN fetch_playoff falló (no crítico)"

      - name: fetch_predictions (Predicciones)
        run: python fetch_predictions.py || echo "WARN fetch_predictions falló (no crítico)"

      # ── 5. Build ──────────────────────────────────────────────────────────
      - name: build (genera index.html)
        run: python build.py

      # ── 6. Deploy SFTP al hosting ─────────────────────────────────────────
      - name: Deploy SFTP
        env:
          IONOS_SFTP_PASS: ${{ secrets.IONOS_SFTP_PASS }}
        run: python deploy.py --sftp --only-deploy

