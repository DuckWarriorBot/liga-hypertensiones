name: Actualizar Liga Hypertensiones

on:
  schedule:
    - cron: '*/10 11-21 * * *'
    - cron: '0 0-10,22-23 * * *'
  workflow_dispatch:

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar Chromium
        run: python -m playwright install chromium --with-deps

      - name: Descargar datos persistentes desde hosting
        env:
          SFTP_HOST: ${{ secrets.SFTP_SERVER }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASS: ${{ secrets.SFTP_PASSWORD }}
        run: |
          python - <<'EOF'
          import paramiko, os
          try:
              t = paramiko.Transport((os.environ['SFTP_HOST'], int(os.environ.get('SFTP_PORT', 22))))
              t.connect(username=os.environ['SFTP_USER'], password=os.environ['SFTP_PASS'])
              s = paramiko.SFTPClient.from_transport(t)
              # Solo results_db.json se descarga del hosting (crece con partidos)
              # predictions_history.json viene del repo + se actualiza con fetch_predictions.py
              try:
                  s.get('results_db.json', 'results_db.json')
                  print('OK results_db.json descargado del hosting')
              except FileNotFoundError:
                  print('results_db.json no existe en hosting — iniciando BD vacía')
              s.close(); t.close()
          except Exception as e:
              print(f'No se pudo conectar al hosting: {e} — usando archivos del repo')
          EOF

      - name: fetch_all
        run: python fetch_all.py

      - name: fetch_flashscore
        run: python fetch_flashscore.py

      - name: fetch_playoff
        run: python fetch_playoff.py || echo "fetch_playoff falló (no crítico)"

      - name: fetch_predictions
        run: python fetch_predictions.py || echo "fetch_predictions falló (no crítico)"

      - name: build
        run: python build.py

      - name: Deploy SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_SERVER }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASS: ${{ secrets.SFTP_PASSWORD }}
        run: |
          python - <<'EOF'
          import paramiko, os
          files = ['index.html','version.json','liga_data.json','scores_data.json','predictions.json','predictions_history.json','logo.png','results_db.json']
          t = paramiko.Transport((os.environ['SFTP_HOST'], int(os.environ.get('SFTP_PORT', 22))))
          t.connect(username=os.environ['SFTP_USER'], password=os.environ['SFTP_PASS'])
          s = paramiko.SFTPClient.from_transport(t)
          for f in files:
              if os.path.exists(f):
                  s.put(f, f)
                  print(f'OK {f}')
          s.close(); t.close()
          EOF

